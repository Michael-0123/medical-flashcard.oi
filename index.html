<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    
</head>

<body>
    <section class="min-h-screen bg-gray-50 flex items-center justify-center px-6">
        <div class="text-center max-w-2xl">
             
            <div class="relative text-center  max-w-2xl">
                <h1 class="text-4xl md:text-6xl font-light text-black tracking-tight">
                   Flashcards
                </h1>
           </div>
           <div class="button grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-1 lg:grid-cols-1 mt-16">
                <button data-topic="HPV" class="bg-white border border-black/5  shadow-sm text-black font-medium px-8 py-4 rounded-xl md:px-10 md:py-6 transition duration-300">
                        Human Papillomavirus (HPV) Vaccine
                </button>
                
                 <button data-topic="Malaria" class="bg-white  text-black border border-black/5 shadow-sm font-medium px-8 py-4 rounded-xl md:px-10 md:py-6 transition duration-300">                    
                        Malaria
                 </button>

                <button data-topic="TumorMarker"    class="bg-white text-black  border border-black/5 shadow-sm font-medium px-8 py-4 rounded-xl md:px-10 md:py-6 transition duration-300">                 
                        Tumor Markers
                </button>
               <button data-topic="RheumaticFever" class="bg-white  text-black border border-black/5 shadow-sm font-medium px-8 py-4 rounded-xl md:px-10 md:py-6 transition duration-300">                   
                        Rheumatic Fever
               </button>
                 <button data-topic="ChronicLeukaemia" class="bg-white  text-black border border-black/5 shadow-sm font-medium px-8 py-4 rounded-xl md:px-10 md:py-6 transition duration-300">
                        Chronic Myeloid leukaemia           
                 </button>
                 <button data-topic="PathologyNutritional" class="bg-white  text-black border border-black/5 shadow-sm font-medium px-8 py-4 rounded-xl md:px-10 md:py-6 transition duration-300">   
                        Pathology of Nutritional Disorders
                 </button>
                
           </div>
    </section>
    <section id="flashcards" class="hidden min-h-screen bg-gray-50 flex items-center justify-center ">
        <div class="max-w-3xl w-full">
            <div class="perspective w-full min-h-[300px] cursor-pointer">
              <div id="card" class="flip-card-inner">
                
                <div class="flip-card-front bg-white rounded-3xl shadow-xl flex items-center justify-center p-8">
                    <h2 id="question" class="text-xl text-center"></h2>
                </div>
                
                <div class="flip-card-back bg-white text-black rounded-3xl shadow-xl flex items-center justify-center p-8">
                    <p id="answer" class="text-xl text-center leading-relaxed"></p>
                </div>
                
            </div>
            </div>

            <div id="progress" class="text-center mt-6 text-lg font-semibold"></div>

            <div class="flex justify-between mt-8">
                <button id="prev" class="bg-black ml-4 text-white px-8 py-3 rounded-xl">Previous</button>
                <button id="next" class="bg-black mr-4 text-white px-8 py-3 rounded-xl">Next</button>
            </div>
      </div>
    </section>
    <section class="bg-gray-50  text-center text-gray-800 mb-6 text-[12px] font-semibold white-space-pre-wrap">
        <div class="p-4">
            Initiated by Ezidimma Chukwuemeka
        </div>
        <div>
            Created by Akinwumi Mayorkun
        </div>
        
    </section>



<script type="module" src="index.js"></script>
</body>
</html>
